services:
  # Backend API Web Service
  - type: web
    name: student-hub-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://student-hub.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: studenthub-db
          property: connectionString

  # Frontend Web Service (Static Site)
  - type: web
    name: student-hub-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # Managed PostgreSQL Database
  - name: studenthub-db
    databaseName: studenthub
    user: studenthub_user
    plan: free
